# GitHub Actions publish workflow for gstack-opencode
# Manual fallback for publishing outside the Release Please flow
name: Publish (Manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish/tag/release)'
        required: false
        type: boolean
        default: false
      dist_tag:
        description: 'npm dist tag (e.g., latest, next)'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Type check
        run: bun run typecheck

      - name: Build package
        run: bun run build:all

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          TAG_ARG=""
          if [ -n "${{ inputs.dist_tag }}" ]; then
            TAG_ARG="--tag ${{ inputs.dist_tag }}"
          fi
          npm publish --access public --provenance $TAG_ARG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create git tag
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
