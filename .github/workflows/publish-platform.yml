name: publish-platform
run-name: 'platform packages ${{ inputs.version }}'

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dist_tag:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string
      dist_tag:
        description: 'npm dist tag (e.g., beta, latest)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ startsWith(matrix.platform, 'windows-') && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        platform:
          - darwin-arm64
          - darwin-x64
          - darwin-x64-baseline
          - linux-arm64
          - linux-x64
          - linux-x64-baseline
          - linux-arm64-musl
          - linux-x64-musl
          - linux-x64-musl-baseline
          - windows-x64
          - windows-x64-baseline
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check if already published
        id: check
        run: |
          VERSION="${{ inputs.version }}"
          PACKAGE="gstack-${{ matrix.platform }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@nntoan/${PACKAGE}/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update version in package.json
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION="${{ inputs.version }}"
          jq --arg v "$VERSION" '.version = $v' packages/${{ matrix.platform }}/package.json > tmp.json
          mv tmp.json packages/${{ matrix.platform }}/package.json

      - name: Pre-download baseline compile target
        if: steps.check.outputs.skip != 'true' && endsWith(matrix.platform, '-baseline')
        shell: bash
        run: |
          BUN_VERSION=$(bun --version)
          PLATFORM="${{ matrix.platform }}"
          COMPILE_TARGET="${PLATFORM}"
          PKG_NAME="bun-${COMPILE_TARGET}"
          CACHE_DIR=$(bun pm cache)
          CACHE_DEST="${CACHE_DIR}/${PKG_NAME}-v${BUN_VERSION}"

          if [[ -f "$CACHE_DEST" ]]; then
            echo "✓ Compile target already cached at ${CACHE_DEST}"
            exit 0
          fi

          echo "Pre-downloading ${PKG_NAME} v${BUN_VERSION} to ${CACHE_DEST}"
          TARBALL_URL="https://registry.npmjs.org/@oven/${PKG_NAME}/-/${PKG_NAME}-${BUN_VERSION}.tgz"
          echo "URL: ${TARBALL_URL}"

          mkdir -p "$(dirname "$CACHE_DEST")"
          TMP_DIR=$(mktemp -d)

          curl -fsSL --retry 5 --retry-delay 5 "${TARBALL_URL}" | tar -xzf - -C "${TMP_DIR}"

          if [[ "$COMPILE_TARGET" == windows-* ]]; then
            BIN_NAME="bun.exe"
          else
            BIN_NAME="bun"
          fi

          if [[ -f "${TMP_DIR}/package/bin/${BIN_NAME}" ]]; then
            cp "${TMP_DIR}/package/bin/${BIN_NAME}" "${CACHE_DEST}"
          elif [[ -f "${TMP_DIR}/package/${BIN_NAME}" ]]; then
            cp "${TMP_DIR}/package/${BIN_NAME}" "${CACHE_DEST}"
          else
            echo "Could not find ${BIN_NAME} in tarball; listing files:"
            find "${TMP_DIR}" -type f
            exit 1
          fi

          chmod +x "${CACHE_DEST}" 2>/dev/null || true
          echo "✓ Pre-downloaded to ${CACHE_DEST}"
          ls -lh "${CACHE_DEST}"

      - name: Build binary
        if: steps.check.outputs.skip != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 15
          shell: bash
          command: |
            PLATFORM="${{ matrix.platform }}"

            case "$PLATFORM" in
              darwin-arm64) TARGET="bun-darwin-arm64" ;;
              darwin-x64) TARGET="bun-darwin-x64" ;;
              darwin-x64-baseline) TARGET="bun-darwin-x64-baseline" ;;
              linux-arm64) TARGET="bun-linux-arm64" ;;
              linux-x64) TARGET="bun-linux-x64" ;;
              linux-x64-baseline) TARGET="bun-linux-x64-baseline" ;;
              linux-arm64-musl) TARGET="bun-linux-arm64-musl" ;;
              linux-x64-musl) TARGET="bun-linux-x64-musl" ;;
              linux-x64-musl-baseline) TARGET="bun-linux-x64-musl-baseline" ;;
              windows-x64) TARGET="bun-windows-x64" ;;
              windows-x64-baseline) TARGET="bun-windows-x64-baseline" ;;
              *)
                echo "Unknown platform: $PLATFORM"
                exit 1
                ;;
            esac

            if [[ "$PLATFORM" == windows-* ]]; then
              OUTPUT="packages/${PLATFORM}/bin/gstack.exe"
            else
              OUTPUT="packages/${PLATFORM}/bin/gstack"
            fi

            mkdir -p "$(dirname "$OUTPUT")"
            bun build src/cli/index.ts --compile --minify --target="$TARGET" --outfile="$OUTPUT"

            echo "Built binary:"
            ls -lh "$OUTPUT"

      - name: Compress artifact
        if: steps.check.outputs.skip != 'true'
        run: |
          PLATFORM="${{ matrix.platform }}"
          cd packages/${PLATFORM}
          if [[ "$PLATFORM" == windows-* ]]; then
            7z a -tzip ../../binary-${PLATFORM}.zip bin/ package.json
          else
            tar -czvf ../../binary-${PLATFORM}.tar.gz bin/ package.json
          fi

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            binary-${{ matrix.platform }}.tar.gz
            binary-${{ matrix.platform }}.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - darwin-arm64
          - darwin-x64
          - darwin-x64-baseline
          - linux-arm64
          - linux-x64
          - linux-x64-baseline
          - linux-arm64-musl
          - linux-x64-musl
          - linux-x64-musl-baseline
          - windows-x64
          - windows-x64-baseline
    steps:
      - name: Check if already published
        id: check
        run: |
          VERSION="${{ inputs.version }}"
          PACKAGE="gstack-${{ matrix.platform }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@nntoan/${PACKAGE}/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        id: download
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: .

      - name: Determine artifact presence
        id: artifact
        if: steps.check.outputs.skip != 'true'
        run: |
          PLATFORM="${{ matrix.platform }}"

          if [[ -f "binary-${PLATFORM}.zip" || -f "binary-${PLATFORM}.tar.gz" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publish for ${PLATFORM}: artifact missing (likely upstream build failure)."
          fi

      - name: Extract artifact
        if: steps.check.outputs.skip != 'true' && steps.artifact.outputs.available == 'true'
        run: |
          PLATFORM="${{ matrix.platform }}"
          mkdir -p packages/${PLATFORM}
          if [[ "$PLATFORM" == windows-* ]]; then
            unzip binary-${PLATFORM}.zip -d packages/${PLATFORM}/
          else
            tar -xzvf binary-${PLATFORM}.tar.gz -C packages/${PLATFORM}/
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true' && steps.artifact.outputs.available == 'true'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @nntoan/${{ matrix.platform }}
        if: steps.check.outputs.skip != 'true' && steps.artifact.outputs.available == 'true'
        run: |
          cd packages/${{ matrix.platform }}
          TAG_ARG=""
          if [ -n "${{ inputs.dist_tag }}" ]; then
            TAG_ARG="--tag ${{ inputs.dist_tag }}"
          fi
          npm publish --access public --provenance $TAG_ARG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        timeout-minutes: 15
